# Portfolio — full stack on one host, modeled on the SimpleFlow deploy.
# SimpleFlow already binds :80 on this VPS, so the portfolio web is published on
# :8080. The API is internal-only; the web's nginx proxies /api to it.
services:
  api:
    build: ./api
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=file:/data/dev.db
      # Browser calls are same-origin via the web's nginx proxy, but allow the
      # public origin too for any direct hits.
      - CORS_ORIGINS=${PORTFOLIO_PUBLIC_ORIGIN:-http://187.124.93.159:8080}
      # Optional: wire the real SimpleFlow orchestrator (left blank = built-in
      # fallback planner, so the demo always works).
      - SIMPLEFLOW_URL=${SIMPLEFLOW_URL:-}
      - SIMPLEFLOW_TOKEN=${SIMPLEFLOW_TOKEN:-}
      - SIMPLEFLOW_USER_ID=${SIMPLEFLOW_USER_ID:-1}
    volumes:
      - portfolio-db:/data
    networks:
      - portfolio-network
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - portfolio-network
    restart: unless-stopped

volumes:
  portfolio-db:

networks:
  portfolio-network:
    driver: bridge
