# Portfolio — full stack on one host, modeled on the SimpleFlow deploy.
# SimpleFlow already uses :8080 on this VPS (and :3001/:3002/:5433/:5678), so the
# portfolio web defaults to :8090. Override with PORTFOLIO_WEB_PORT if needed.
# The API is internal-only; the web's nginx proxies /api to it.
services:
  api:
    build: ./api
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=file:/data/dev.db
      # Browser calls are same-origin via the web's nginx proxy, but allow the
      # public origin too for any direct hits.
      - CORS_ORIGINS=${PORTFOLIO_PUBLIC_ORIGIN:-https://portfolio.syncstack.tech,http://187.124.93.159:8090}
      # Optional: wire the real SimpleFlow orchestrator (left blank = built-in
      # fallback planner, so the demo always works).
      - SIMPLEFLOW_URL=${SIMPLEFLOW_URL:-}
      - SIMPLEFLOW_TOKEN=${SIMPLEFLOW_TOKEN:-}
      - SIMPLEFLOW_USER_ID=${SIMPLEFLOW_USER_ID:-1}
      # Google Calendar/Meet booking (reuses the SimpleFlow OAuth app). Values
      # come from the .env next to this compose file on the VPS.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-https://portfolio.syncstack.tech/api/meetings/google/callback}
      - MEETINGS_TIMEZONE=${MEETINGS_TIMEZONE:-Asia/Manila}
      - MEETINGS_DURATION_MIN=${MEETINGS_DURATION_MIN:-30}
      - MEETINGS_SETUP_KEY=${MEETINGS_SETUP_KEY:-}
    volumes:
      - portfolio-db:/data
    networks:
      - portfolio-network
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "${PORTFOLIO_WEB_PORT:-8090}:80"
    depends_on:
      - api
    networks:
      - portfolio-network
    restart: unless-stopped

volumes:
  portfolio-db:

networks:
  portfolio-network:
    driver: bridge
